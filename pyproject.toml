[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "second-shift"
version = "0.1.0"
description = "Second Shift: governance for AI agents, an agent factory, and work discovery"
requires-python = ">=3.11,<3.13"
dependencies = [
    "click>=8.3.3",
    "httpx>=0.27",
    "cryptography>=48.0.1",
    "idna>=3.15",
    "tzdata>=2026.3",
    "pyjwt[crypto]>=2.13.0",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "pyobjc-framework-Cocoa>=11,<13; sys_platform=='darwin'",
]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.3.5,<4"]
# The agent factory uses the Second Shift runtime as a library. Install the runtime first when working from a checkout
# (pip install -e './runtime[office]'); the extra is then already satisfied. Without it the factory pages say it is not installed.
factory = ["second-shift-runtime[office]>=0.1"]
dev = ["pytest>=8", "pytest-asyncio", "pytest-xdist", "pytest-timeout", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["maverick*", "maverick_dashboard*"]

[tool.setuptools.package-data]
maverick_dashboard = ["templates/*.html", "static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--import-mode=importlib"
pythonpath = ["."]
asyncio_mode = "strict"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "C90", "B", "G", "RSE"]
ignore = [
    "E501",   # line length
    "UP042",  # str-and-Enum classes stay as they are: StrEnum formats values differently
    "UP017",  # timezone.utc is kept as written
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers in argument defaults are the framework idiom.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Path",
    "fastapi.Body", "fastapi.Header", "fastapi.Cookie", "fastapi.Security",
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.isort]
known-first-party = ["maverick", "maverick_dashboard", "test_support"]
