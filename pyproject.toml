[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "second-shift"
version = "0.1.0"
description = "Second Shift: governance for AI agents, an agent factory, and work discovery"
requires-python = ">=3.11,<3.13"
dependencies = [
    "click>=8.3.3",
    "httpx>=0.27",
    "cryptography>=48.0.1",
    "idna>=3.15",
    "tzdata>=2026.3",
    "pyjwt[crypto]>=2.13.0",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "pyobjc-framework-Cocoa>=11,<13; sys_platform=='darwin'",
]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.3.5,<4"]
dev = ["pytest>=8", "pytest-asyncio", "pytest-xdist", "pytest-timeout", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["maverick*", "maverick_dashboard*"]

[tool.setuptools.package-data]
maverick_dashboard = ["templates/*.html", "static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--import-mode=importlib"
pythonpath = ["."]
asyncio_mode = "strict"

[tool.ruff]
line-length = 140
target-version = "py311"
