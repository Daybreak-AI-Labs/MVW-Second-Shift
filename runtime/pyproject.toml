[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-shift-runtime"
version = "0.1.0"
description = "A small agent runtime that asks Second Shift before every action."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
# Only the document skills use these; a skill whose library is missing says so.
office = ["python-docx>=1.1", "python-pptx>=1.0", "openpyxl>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
second-shift-runtime = "second_shift_runtime.__main__:main"

[tool.setuptools.packages.find]
include = ["second_shift_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["tests"]
