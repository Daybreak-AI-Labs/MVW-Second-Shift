name: Measure MVW request performance

on:
  push:
    branches:
      - codex/request-cost
      - codex/worker-processes
      - codex/sqlite-stores-to-postgres
      - codex/per-person-records
      - codex/load-check-mvw
    paths-ignore:
      - 'docs/**'
      - 'handoff/**'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-benchmark-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SECOND_SHIFT_LOAD_DSN: postgresql://postgres:local-benchmark-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install '.[postgres]' './runtime[office]'
      - run: docker build -f deploy/azure/Dockerfile -t second-shift:benchmark .
      - name: Measure and profile the app at the Azure CPU and memory limits
        run: |
          mkdir -p "$RUNNER_TEMP/second-shift-benchmark"
          out="$RUNNER_TEMP/second-shift-benchmark"
          cpu=$(sed -nE "s/.*cpu: json\('([^']+)'\).*/\1/p" deploy/azure/app.bicep)
          memory=$(sed -nE "s/.*memory: '([0-9]+)Gi'.*/\1/p" deploy/azure/app.bicep)
          python -m tools.mvw_benchmark --cpus "$cpu" --memory-gib "$memory" --output "$out/measure.json"
          python -m tools.mvw_benchmark --cpus "$cpu" --memory-gib "$memory" --profile --output "$out/profile.json"
          OUT="$out" python - <<'PY'
          import json
          import os
          import pstats
          from pathlib import Path
          out = Path(os.environ["OUT"])
          results = json.loads((out / "measure.json").read_text())
          for scenario, results in results.items():
              print(f"::notice title={scenario}::{json.dumps(results, separators=(',', ':'))}")
          stats = pstats.Stats(str(out / "request-profile.pstats"))
          stats.sort_stats("cumulative").print_stats("maverick(_dashboard)?/", 55)
          items = [(f"{Path(name).name}:{line} {func}", round(values[3], 3), values[1])
                   for (name, line, func), values in stats.stats.items()
                   if "/maverick" in name and "__init__" not in name]
          items.sort(key=lambda entry: entry[1], reverse=True)
          print(f"::notice title=Request profile::{json.dumps(items[:35], separators=(',', ':'))}")
          PY
