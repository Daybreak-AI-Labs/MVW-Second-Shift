name: Measure MVW request performance

on:
  push:
    branches:
      - codex/request-cost
      - codex/worker-processes
      - codex/sqlite-stores-to-postgres
      - codex/per-person-records
      - codex/load-check-mvw
      - codex/ekko-throughput
      - codex/platform-speed
      - codex/burst-latency
      - codex/approval-read-speed
      - codex/debug-platform
    paths-ignore:
      - 'docs/**'
      - 'handoff/**'

permissions:
  contents: read

concurrency:
  group: mvw-benchmark-${{ github.ref }}-${{ contains(github.event.head_commit.message, 'Measure final recorder hour') && github.sha || contains(github.event.head_commit.message, 'Measure recorder hour') && 'recorder-hour' || contains(github.event.head_commit.message, 'Measure burst') && 'quick' || 'comparison' }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(github.ref_name == 'codex/burst-latency' && '["requested","mixed-live","mixed-live-500"]' || github.ref_name == 'codex/debug-platform' && '["requested","mixed-live-500"]' || github.ref_name == 'codex/platform-speed' && '["requested","mixed-live"]' || contains(github.event.head_commit.message, 'paired app comparison') && '["requested","comparison","sustained"]' || contains(github.event.head_commit.message, 'Measure final recorder hour') && '["requested","comparison"]' || '["requested"]') }}
    timeout-minutes: 85
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-benchmark-only
        ports:
          - 5432/tcp
        options: >-
          --cpus 2 --memory 8g --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out the benchmark commit
        run: |
          curl --fail --silent --show-error --location --retry 2 --max-time 45 \
            "https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$GITHUB_SHA" |
            tar -xz --strip-components=1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install '.[postgres]' './runtime[office]' 'aiohttp==3.14.5'
      - run: docker build -f deploy/azure/Dockerfile -t second-shift:benchmark .
      - name: Measure and profile the app at the Azure CPU and memory limits
        env:
          BENCHMARK_TITLE: ${{ github.event.head_commit.message }}
          BENCHMARK_SCENARIO: ${{ matrix.scenario }}
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          SECOND_SHIFT_LOAD_DSN: postgresql://postgres:local-benchmark-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: |
          mkdir -p "$RUNNER_TEMP/second-shift-benchmark"
          out="$RUNNER_TEMP/second-shift-benchmark"
          cpu=$(sed -nE "s/.*cpu: json\('([^']+)'\).*/\1/p" deploy/azure/app.bicep)
          memory=$(sed -nE "s/.*memory: '([0-9]+)Gi'.*/\1/p" deploy/azure/app.bicep)
          workers=$(sed -nE 's/^param dashboardWorkers int = ([0-9]+)$/\1/p' deploy/azure/app.bicep)
          pool=$(sed -nE "s/.*SECOND_SHIFT_PG_POOL_SIZE: '([0-9]+)'.*/\1/p" deploy/azure/app.bicep)
          args=()
          recorder_seconds=0
          if [[ "$GITHUB_REF_NAME" =~ ^codex/(load-check-mvw|ekko-throughput|platform-speed|burst-latency|approval-read-speed|debug-platform)$ ]]; then
            args=(--mvw --population 20000 --seconds 120 --require-targets)
            case "$BENCHMARK_SCENARIO:$BENCHMARK_TITLE" in
              mixed-live:*) args=(--mixed-live --population 20000 --agents 25 --burst 100) ;;
              mixed-live-500:*) args=(--mixed-live --population 20000 --agents 25 --burst 500) ;;
              requested:*"Measure recorder hour"*|requested:*"Measure final recorder hour"*)
                args=(--recorders 2000 --population 20000 --seconds 3600) ;;
              requested:*"Measure recorder pilot"*) args=(--recorders 2000 --population 20000 --seconds 90) ;;
              sustained:*) args=(--recorders 2000 --population 20000 --seconds 300) ;;
              requested:*"Measure burst"*) args=(--quick --population 20000) ;;
            esac
          fi
          if [ "${args[0]:-}" = --recorders ]; then recorder_seconds="${args[5]}"; fi
          lscpu | awk -F: '/^CPU\(s\):|^Model name:/{gsub(/^[[:space:]]+/, "", $2); print $1 ": " $2}'
          read -r database_quota database_period < <(docker exec "$POSTGRES_CONTAINER" cat /sys/fs/cgroup/cpu.max)
          database_memory=$(docker exec "$POSTGRES_CONTAINER" cat /sys/fs/cgroup/memory.max)
          if [ "$database_quota" != 200000 ] || [ "$database_period" != 100000 ] || [ "$database_memory" != 8589934592 ]; then
            printf 'The PostgreSQL container did not receive the expected 2 vCPU and 8 GiB.\n' >&2
            exit 1
          fi
          if [[ "$BENCHMARK_SCENARIO" == mixed-live* ]]; then
            baseline="$RUNNER_TEMP/second-shift-baseline"
            baseline_ref=refs/heads/claude/friendly-shannon-e8jwva
            if [ "$GITHUB_REF_NAME" = codex/burst-latency ]; then
              baseline_ref=8d2219761111780f6bdd4eda78e1a17d0673cd30
            elif [ "$GITHUB_REF_NAME" = codex/debug-platform ]; then
              baseline_ref=3d160bc28e654821d1ffaab4b1736745e73d0b16
            fi
            mkdir -p "$baseline"
            curl --fail --silent --show-error --location --retry 2 --max-time 45 \
              "https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$baseline_ref" |
              tar -xz --strip-components=1 -C "$baseline"
            cp tools/mvw_benchmark.py "$baseline/tools/"
            (cd "$baseline" && python -m tools.mvw_benchmark --cpus "$cpu" --memory-gib "$memory" \
              --workers "$workers" --pool-size "$pool" "${args[@]}" --output "$out/baseline.json")
          fi
          measured=0
          python -m tools.mvw_benchmark --cpus "$cpu" --memory-gib "$memory" \
            --workers "$workers" --pool-size "$pool" "${args[@]}" --output "$out/measure.json" || measured=$?
          OUT="$out" RECORDER_SECONDS="$recorder_seconds" python - <<'PY'
          import json
          import os
          from pathlib import Path
          out = Path(os.environ["OUT"])
          report = json.loads((out / "measure.json").read_text())
          if (out / "baseline.json").exists():
              baseline = json.loads((out / "baseline.json").read_text())
              for scenario, results in baseline.items():
                  print(f"::notice title=baseline {scenario}::{json.dumps(results, separators=(',', ':'))}")
          for scenario, results in report.items():
              print(f"::notice title={scenario}::{json.dumps(results, separators=(',', ':'))}")
          if "live_flows" in report and (
              report["live_flows"] != {"attempted": 25, "completed": 25}
              or any(item["errors"] for item in report["mixed_live"].values())
          ):
              raise SystemExit("A browser, Teams or live agent request failed under mixed traffic.")
          seconds = int(os.environ["RECORDER_SECONDS"])
          if seconds and seconds % 30 == 0:
              for operation, scheduled in (
                  ("Recorder instructions", 2000 * (seconds // 5)),
                  ("Recorder hand-over", 2000 * (seconds // 30 - 1)),
              ):
                  result = report["recorder"][operation]
                  if result["scheduled"] != scheduled or result["count"] > scheduled:
                      raise SystemExit(f"{operation} counts differ from the configured schedule.")
          PY
          if [ "$measured" -ne 0 ] || [ "$workers" -ne 1 ]; then exit "$measured"; fi
          python -m tools.mvw_benchmark --cpus "$cpu" --memory-gib "$memory" --profile --output "$out/profile.json"
          OUT="$out" python - <<'PY'
          import json
          import os
          import pstats
          from pathlib import Path
          out = Path(os.environ["OUT"])
          stats = pstats.Stats(str(out / "request-profile.pstats"))
          stats.sort_stats("cumulative").print_stats("maverick(_dashboard)?/", 55)
          items = [(f"{Path(name).name}:{line} {func}", round(values[3], 3), values[1])
                   for (name, line, func), values in stats.stats.items()
                   if "/maverick" in name and "__init__" not in name]
          items.sort(key=lambda entry: entry[1], reverse=True)
          print(f"::notice title=Request profile::{json.dumps(items[:35], separators=(',', ':'))}")
          PY
